services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: laterbase
      POSTGRES_USER: laterbase
      POSTGRES_PASSWORD: laterbase_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laterbase -d laterbase"]
      interval: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: "postgres://laterbase:laterbase_dev@postgres:5432/laterbase?sslmode=disable"
      PORT: "8080"
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: gpt-4o-mini
      CRAWL4AI_URL: ""
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: ""
    depends_on:
      - api

  # Crawl4AI — started on-demand via profile
  crawl4ai:
    image: unclecode/crawl4ai:latest
    ports:
      - "11235:11235"
    profiles:
      - crawl4ai
    environment:
      CRAWL4AI_API_TOKEN: ""

volumes:
  pgdata:
